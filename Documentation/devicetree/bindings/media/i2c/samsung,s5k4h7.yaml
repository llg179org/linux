%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k4h7.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K4H7 8 Mpixel CMOS Digital Image Sensor

maintainers:
  - Lajosházi, László Gergely <lajoshazilg@gmail.com>

description:
  S5K4H7 is an 8 Mpixel CMOS image sensor with a pixel array of 3264 x 2448.
  It is programmable through an I2C interface and sends image data over
  MIPI CSI-2.

$ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k4h7

  reg:
    maxItems: 1

  clocks:
    description: Master clock (MCLK), 24 MHz.
    maxItems: 1

  reset-gpios:
    description:
      Reference to the GPIO connected to the reset pin, which is active low.
    maxItems: 1

  vdda-supply:
    description: Analog voltage supply, 2.8 V

  vddio-supply:
    description: Interface voltage supply, 1.8 V

  vddd-supply:
    description: Digital core voltage supply, 1.2 V

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes: true
          link-frequencies: true

        required:
          - data-lanes

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - vdda-supply
  - vddio-supply
  - vddd-supply

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@10 {
            compatible = "samsung,s5k4h7";
            reg = <0x10>;

            clocks = <&camera_clk>;

            reset-gpios = <&tlmm 129 GPIO_ACTIVE_LOW>;

            vdda-supply = <&vreg_cam_analog_2p8>;
            vddio-supply = <&vreg_cam_io_1p8>;
            vddd-supply = <&vreg_cam2_dig_1p2>;

            orientation = <0>;
            rotation = <270>;
        };
    };
