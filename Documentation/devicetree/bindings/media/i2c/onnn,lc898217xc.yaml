%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onnn,lc898217xc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ON Semiconductor LC898217 voice coil lens actuator

maintainers:
  - Laszlo Gergely Lajoshazi <lajoshazilg@gmail.com>

description:
  LC898217 is a voice coil motor (VCM) camera lens actuator that is
  controlled over I2C.

properties:
  compatible:
    enum:
      - onnn,lc898217xc

  reg:
    maxItems: 1

  vcc-supply:
    description: Actuator supply

required:
  - compatible
  - reg
  - vcc-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera-lens@72 {
            compatible = "onnn,lc898217xc";
            reg = <0x72>;

            vcc-supply = <&vreg_cam_af_2p85>;
        };
    };

...
