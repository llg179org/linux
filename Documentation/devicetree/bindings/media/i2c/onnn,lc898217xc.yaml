%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/onnn,lc898217xc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ON Semiconductor LC898217 voice coil lens actuator

maintainers:
  - Laszlo Gergely Lajoshazi <lajoshazilg@gmail.com>

description:
  LC898217 is a voice coil motor (VCM) camera lens actuator that is
  controlled over I2C.

properties:
  compatible:
    enum:
      - onnn,lc898217xc

  reg:
    maxItems: 1

  vaf-supply:
    description: Actuator (VCM driver) supply

  vio-supply:
    description:
      I/O supply. It is shared with the camera sensor on the modules the
      actuator ships in, and the actuator does not answer on I2C unless it
      is on; the driver enables it for the whole time the actuator is
      powered so the sensor going down does not take the bus with it.

required:
  - compatible
  - reg
  - vaf-supply
  - vio-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera-lens@72 {
            compatible = "onnn,lc898217xc";
            reg = <0x72>;

            vaf-supply = <&vreg_cam_af_2p85>;
            vio-supply = <&vreg_cam_io_1p8>;
        };
    };

...
